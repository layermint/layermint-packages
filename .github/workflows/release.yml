name: Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Quality gate
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "@layermint:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          pnpm --filter @layermint/shared-types publish --no-git-checks --registry https://npm.pkg.github.com
          pnpm --filter @layermint/sdk-vite publish --no-git-checks --registry https://npm.pkg.github.com
          pnpm --filter @layermint/cli publish --no-git-checks --registry https://npm.pkg.github.com

      - name: Publish to npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          pnpm --filter @layermint/shared-types publish --no-git-checks --access public --registry https://registry.npmjs.org
          pnpm --filter @layermint/sdk-vite publish --no-git-checks --access public --registry https://registry.npmjs.org
          pnpm --filter @layermint/cli publish --no-git-checks --access public --registry https://registry.npmjs.org
